<VirtualHost *:80>
        Header unset Content-Security-Policy
        Header unset Cross-Origin-Opener-Policy
        Header unset X-Frame-Options
        Header unset X-Content-Type-Options
        Header unset Referred-Policy
        Header unset Server
        Header unset X-Powered-By
        
        Header always set Content-Security-Policy "frame-ancestors: 'self'; frame-src: 'self'; form-action: 'self'"
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referred-Policy "strict-origin-when-cross-origin"
        Header always set Server "webserver"

        ServerName "curriculum.local"
        ServerAdmin %{SERVER_ADMIN_EMAIL|webmaster@localhost}

        DocumentRoot /var/www/html/public
        DirectoryIndex index.php

        AddDefaultCharset utf-8

        <Directory "/">
            Options FollowSymLinks
            AllowOverride None
        </Directory>

        <DirectoryMatch "(?i)/\.(?!well-known).*">
            Require all denied
        </DirectoryMatch>

        SetEnvIf Request_URI "/favicon.ico" dontlog
        SetEnvIf Request_URI "/robots.txt" dontlog

        ErrorDocument 404 index.php

        # TODO: Figure out the routing (nginx config uses FastCGI?)

        # Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
        # error, crit, alert, emerg.
        # It is also possible to configure the loglevel for particular
        # modules, e.g.
        #LogLevel info ssl:warn

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined env=!dontlog

        # For most configuration files from conf-available/, which are
        # enabled or disabled at a global level, it is possible to
        # include a line for only one particular virtual host. For example the
        # following line enables the CGI configuration for this host only
        # after it has been globally disabled with "a2disconf".
        #Include conf-available/serve-cgi-bin.conf
</VirtualHost>